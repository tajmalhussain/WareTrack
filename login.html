<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WareTrack - Secure Logistics & Warehouse Inventory Portal">
    <title>Sign In | WareTrack Warehouse Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15) 0%, rgba(10, 14, 23, 1) 70%);
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: var(--gradient-primary);
            border-radius: var(--radius-md);
            font-size: 2rem;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .login-form .form-group {
            margin-bottom: 20px;
        }

        .login-form label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .login-form input {
            width: 100%;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 14px 12px 42px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all var(--transition-fast);
        }

        .login-form input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--gradient-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }

        .login-alert {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #f87171;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .demo-roles {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid var(--border-subtle);
        }

        .demo-roles-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-align: center;
            font-weight: 600;
        }

        .demo-role-pills {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .role-pill {
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all var(--transition-fast);
            color: var(--text-secondary);
            font-size: 0.82rem;
        }

        .role-pill:hover {
            border-color: var(--primary);
            background: var(--bg-card-hover);
            color: var(--text-primary);
            transform: translateX(4px);
        }

        .role-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary-light);
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">📦</div>
            <h1>WareTrack Portal</h1>
            <p>Warehouse Management & Live Telemetry</p>
        </div>

        <div id="loginAlert" class="login-alert">
            <span>⚠️</span>
            <span id="alertMsg">Invalid credentials</span>
        </div>

        <form class="login-form" id="loginForm" onsubmit="handleStaticLogin(event)">
            <div class="form-group">
                <label for="username">Operator ID / Username</label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" name="username" placeholder="e.g. admin" required autofocus autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Security Password</label>
                <div class="input-wrap">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="login-btn">
                <span>Sign In to System</span>
                <span>→</span>
            </button>
        </form>

        <!-- Fast Demo Credential Buttons -->
        <div class="demo-roles">
            <div class="demo-roles-title">⚡ 1-Click Demo Accounts</div>
            <div class="demo-role-pills">
                <div class="role-pill" onclick="quickFill('admin', 'admin123')">
                    <div>
                        <strong>admin</strong> • Admin Officer
                    </div>
                    <span class="role-badge">Chief Logistics</span>
                </div>
                <div class="role-pill" onclick="quickFill('manager', 'manager123')">
                    <div>
                        <strong>manager</strong> • Sarah Jenkins
                    </div>
                    <span class="role-badge">Manager</span>
                </div>
                <div class="role-pill" onclick="quickFill('operator', 'operator123')">
                    <div>
                        <strong>operator</strong> • Rajesh Kumar
                    </div>
                    <span class="role-badge">Stock Controller</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function quickFill(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            loginWithUser(user, pass);
        }

        function handleStaticLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            loginWithUser(user, pass);
        }

        function loginWithUser(user, pass) {
            const accounts = {
                'admin': { pass: 'admin123', name: 'Admin Officer', role: 'Chief Logistics', initials: 'AD', email: 'admin@waretrack.internal' },
                'manager': { pass: 'manager123', name: 'Sarah Jenkins', role: 'Warehouse Manager', initials: 'SJ', email: 's.jenkins@waretrack.internal' },
                'operator': { pass: 'operator123', name: 'Rajesh Kumar', role: 'Stock Controller', initials: 'RK', email: 'r.kumar@waretrack.internal' }
            };

            if (accounts[user] && accounts[user].pass === pass) {
                localStorage.setItem('waretrack_logged_in_user', JSON.stringify({
                    username: user,
                    full_name: accounts[user].name,
                    role: accounts[user].role,
                    initials: accounts[user].initials,
                    email: accounts[user].email
                }));
                window.location.href = 'index.html';
            } else {
                const alertEl = document.getElementById('loginAlert');
                alertEl.style.display = 'flex';
                document.getElementById('alertMsg').textContent = 'Invalid username or password.';
            }
        }
    </script>

</body>

</html>
